name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  domain-tests:
    name: domain-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # The PR merge has the target base as its first parent.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run unit tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Run public release hygiene gate
        run: python3 scripts/verify-public-release.py
      - name: Run data integrity gate
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
          RELEASE_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$RELEASE_BASE" ]; then
            python3 scripts/verify-data-integrity.py --base "$RELEASE_BASE"
          else
            python3 scripts/verify-data-integrity.py
          fi
      - name: Audit public guide boards
        run: npm run guides:audit -- --all --strict
      - name: Verify production build
        run: npx next build --webpack
