name: Data refresh

on:
  # Stagger refreshes away from GitHub Actions peak load at the top of the hour.
  schedule:
    - cron: '17 1 * * *'
    - cron: '53 2 * * *'
    - cron: '17 7 * * *'
    - cron: '17 13 * * *'
    - cron: '17 19 * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 采集配置
        type: choice
        options: [fast, daily, all]
        default: fast
        required: true
      dry_run:
        description: 仅核查上游与采集计划
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  check-launch:
    if: github.repository == 'Evenstar-tools/tft-comp-notes-public' && github.ref == 'refs/heads/main' && github.event.schedule == '37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          LAUNCH_READ_TOKEN: ${{ github.token }}
        run: node site/scripts/select-data-refresh-plan.mjs

  refresh:
    needs: check-launch
    if: >-
      ${{ !cancelled() && github.repository == 'Evenstar-tools/tft-comp-notes-public' && github.ref == 'refs/heads/main' &&
      (github.event.schedule != '37 * * * *' || needs.check-launch.outputs.profile != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: data-refresh-main
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Select refresh plan
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          LAUNCH_READ_TOKEN: ${{ github.token }}
        run: node scripts/select-data-refresh-plan.mjs
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.profile != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.profile != ''
        with:
          python-version: '3.12'
      - name: Install Python collector dependencies
        if: steps.plan.outputs.profile != '' && inputs.dry_run != true && steps.plan.outputs.profile != 'fast'
        run: python -m pip install requests beautifulsoup4
      - name: Install Playwright Chromium
        if: steps.plan.outputs.profile != '' && inputs.dry_run != true
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          npx --yes "playwright@$version" install --with-deps chromium
      - name: Preview conditional refresh
        if: steps.plan.outputs.profile != '' && inputs.dry_run == true
        env:
          PROFILE: ${{ steps.plan.outputs.profile }}
        # The conditional runner adds --archive to the daily profile.
        run: node scripts/run-conditional-refresh.mjs --profile "$PROFILE" --dry-run
      - name: Run conditional refresh and publish verified data
        id: refresh
        if: steps.plan.outputs.profile != '' && inputs.dry_run != true
        env:
          PROFILE: ${{ steps.plan.outputs.profile }}
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          : "${GH_TOKEN:?Configure DATA_REFRESH_TOKEN for candidate PR checks}"
          gh auth setup-git --hostname github.com
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/run-conditional-refresh.mjs --profile "$PROFILE"
      - name: ${{ steps.plan.outputs.launch_marker || 'Record verified launch data' }}
        if: steps.plan.outputs.launch_marker != '' && steps.refresh.outputs.collected == 'true'
        run: echo '本次开服档已完成采集和验收'
